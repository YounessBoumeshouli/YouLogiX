version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: youlogix_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  fastapi:
    build: .
    container_name: youlogix_fastapi_app
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
  tests:
    build: .
    command: pytest -vv --showlocals tests
    depends_on:
      - postgres
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1  # Ensures logs appear immediately in your terminal
    tty: true               # Allows for colored output and better formatting
    volumes:
      - .:/app

volumes:
  pgdata: